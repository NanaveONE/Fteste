name: Compilar ReXGlue codegen Linux (sem arquivos de jogo)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codegen-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Instalar compilador e dependencias publicas SDL3/X11
        run: |
          sudo apt-get update -qq
          # SDL3 fails CMake configure if an enabled X11 extension is missing.
          # The initial CI failure was XSCRNSAVER (libxss-dev). Install the
          # other enabled X11 development extensions BEFORE SDL checks them.
          sudo apt-get install -y --no-install-recommends \
            clang-19 libstdc++-13-dev cmake ninja-build patchelf pkg-config python3 git \
            libvulkan-dev libx11-dev libxext-dev libxi-dev libxrandr-dev \
            libxcursor-dev libxinerama-dev libxkbcommon-dev libwayland-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev \
            libxss-dev libxtst-dev libxfixes-dev libxrender-dev \
            libxdamage-dev libx11-xcb-dev libxcb1-dev libxcb-xfixes0-dev \
            libxxf86vm-dev libdrm-dev libgbm-dev libegl1-mesa-dev
          # Preflight the host headers and mandatory Linux window-system
          # pkg-config interfaces. This gives actionable errors before CMake.
          test -r /usr/include/X11/extensions/scrnsaver.h || {
            echo 'BLOCKED: SDL3 XScreenSaver headers missing (libxss-dev)' >&2; exit 2;
          }
          test -r /usr/include/X11/extensions/XTest.h || {
            echo 'BLOCKED: SDL3 XTest headers missing (libxtst-dev)' >&2; exit 2;
          }
          for module in x11-xcb wayland-client xkbcommon; do
            pkg-config --exists "$module" || {
              echo "BLOCKED: missing Linux pkg-config module $module" >&2; exit 2;
            }
          done
          mkdir -p build/deps
          git clone --depth 1 --recurse-submodules \
            https://github.com/shipa-2/rexglue-xerenge.git \
            build/deps/rexglue-xerenge
          git -C build/deps/rexglue-xerenge submodule update --init --recursive
      - name: Validar toolchain C++23 do Codegen antes do CMake
        run: |
          # Clang 18 on Ubuntu 24.04 advertises __cpp_concepts=201907L:
          # libstdc++ hides std::expected despite -std=c++23. Clang 19 fixes it.
          python3 scripts/check_fable_codegen_cpp23.py --cc clang-19 --cxx clang++-19
      - name: Compilar gerador de codigo PPC para host Linux x86_64
        run: |
          sdk="$GITHUB_WORKSPACE/build/deps/rexglue-xerenge"
          cmake --preset linux-amd64 -S "$sdk" \
            -DCMAKE_C_COMPILER=/usr/bin/clang-19 \
            -DCMAKE_CXX_COMPILER=/usr/bin/clang++-19 \
            -DREXGLUE_ENABLE_TRACY=OFF -DREXGLUE_ENABLE_PERF_COUNTERS=OFF
          # Fail if CMake silently reuses a cached /usr/bin/clang++ (LLVM 18).
          grep -Eq '^CMAKE_CXX_COMPILER:(FILEPATH|STRING)=/usr/bin/clang\+\+-19$' \
            "$sdk/out/build/linux-amd64/CMakeCache.txt" || {
            echo 'BLOCKED: CMake is not using clang++-19 for the Codegen build' >&2
            exit 2
          }
          cmake --build "$sdk/out/build/linux-amd64" --config Release \
            --target rexglue --parallel 2
      - name: Verificar ELF, dependencias e empacotar ferramenta host
        run: |
          python3 scripts/package_fable_codegen_host.py \
            --sdk build/deps/rexglue-xerenge \
            --output build/artifacts/fable2-codegen-linux
          test -x build/artifacts/fable2-codegen-linux/rexglue
          build/artifacts/fable2-codegen-linux/rexglue --version
          build/artifacts/fable2-codegen-linux/rexglue codegen --help
      - name: Publicar gerador de codigo open-source
        uses: actions/upload-artifact@v4
        with:
          name: fable2-rexglue-codegen-linux-x86_64
          path: build/artifacts/fable2-codegen-linux/
          if-no-files-found: error
      - name: Resumo
        if: always()
        run: |
          echo 'Workflow gera APENAS o executavel Linux do ReXGlue codegen.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Nao acessa default.xex, bancos SBK, pasta data/ ou codigo gerado do jogo.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Ainda nao compila libfable2.so nem APK Android.' >> "$GITHUB_STEP_SUMMARY"
