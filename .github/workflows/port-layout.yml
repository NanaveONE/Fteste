name: Fable II Android - Verificar integracao
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-sources:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testar arquivos e overlay Android
        run: |
          python -m unittest discover -s tests -v
          python scripts/verify_port_layout.py
          bash -n scripts/package_android_apk.sh
      - name: Conferir geracao do CMake Android em copia local
        run: |
          python scripts/prepare_android_target.py
          grep -n 'add_library(fable_2 SHARED' build/fable2-android-worktree/CMakeLists.txt
          grep -n 'GPU_PLUGINS plume' build/fable2-android-worktree/CMakeLists.txt
      - name: Resumo
        if: always()
        run: |
          echo 'Este workflow valida fontes e configuracao: NAO produz APK.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Para gameplay faltam SDK ReXGlue Android compativel, codigo nativo e renderizador Vulkan especifico de Fable II.' >> "$GITHUB_STEP_SUMMARY"
