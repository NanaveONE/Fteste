name: Fable II Android - Verificar integracao
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-sources:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testar gerador de target Android
        run: python -m unittest discover -s tests -v
      - name: Conferir interfaces Fable II e Xerenge
        run: python scripts/verify_port_layout.py
      - name: Produzir copia local do CMake Android sem alterar submodulos
        run: |
          python scripts/prepare_android_target.py
          grep -n 'add_library(fable_2 SHARED' build/fable2-android-worktree/CMakeLists.txt
      - name: Resumo
        run: |
          echo 'Este workflow verifica a integracao do codigo, nao produz um APK.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Falta integrar o renderer Vulkan de Fable II, SDK Android e codegen.' >> "$GITHUB_STEP_SUMMARY"
