name: Fable II Android - Verificar integracao
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-sources:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testar arquivos e overlay Android
        run: |
          python -m unittest discover -s tests -v
          python scripts/verify_port_layout.py
          bash -n scripts/package_android_apk.sh scripts/build_android_native.sh scripts/build_fable_gpu.sh scripts/setup_gpu_dependencies.sh scripts/build_host_tools.sh scripts/attempt_playable_build.sh scripts/device_smoke_test.sh scripts/build_rexglue_android_sdk.sh
          python scripts/check_native_libs.py --help
          python scripts/compare_sdk_abi.py --help
          test -f port/android/java/com/nanaveone/fable2/Fable2GameCompatibility.java
          python scripts/generate_fable_shaders.py --help
          python scripts/extract_fable_sbk.py --help
          python scripts/find_fable_shader_banks.py --help
          python scripts/compile_fable_runtime_shaders.py --help
          python scripts/merge_fable_shader_sources.py --help
          python scripts/port_fable_audio_sdk.py --help
          python scripts/gpu_log_report.py --help
          python scripts/prepare_fable_plume.py --help
          python scripts/audit_android_sdk.py --help
          python scripts/stage_android_libs.py --help
          python scripts/playable_preflight.py --help
          # This checkout has no commercial game dump / NDK inputs: failing closed is expected.
          if bash scripts/attempt_playable_build.sh --check; then
            echo "Unexpected preflight success without private game inputs" >&2
            exit 1
          fi
          test -f port/gpu/CMakeLists.txt
      - name: Conferir geracao do CMake Android em copia local
        run: |
          python scripts/prepare_android_target.py
          grep -n 'add_library(fable_2 SHARED' build/fable2-android-worktree/CMakeLists.txt
          grep -n 'rexglue_setup_target(fable_2)' build/fable2-android-worktree/CMakeLists.txt
          grep -n 'FABLE2_USER_ROOT' build/fable2-android-worktree/src/core/fable_2_app.h
          grep -n 'fable2::config::Load(settings_dir' build/fable2-android-worktree/src/core/fable_2_app.h
          grep -n 'endif() # NOT ANDROID: desktop script/Lua staging' build/fable2-android-worktree/CMakeLists.txt
          grep -n 'fable2_touch.cpp' build/fable2-android-worktree/CMakeLists.txt
          grep -n 'generated/default/sources.cmake' build/fable2-android-worktree/CMakeLists.txt
          grep -n 'POSITION_INDEPENDENT_CODE ON' build/fable2-android-worktree/CMakeLists.txt
          grep -n 'FABLE2_CODEGEN_TOOL.* codegen' scripts/build_android_native.sh
      - name: Preparar overlay real do renderer Plume sem alterar upstream
        run: |
          python scripts/prepare_fable_plume.py --xerenge-root external/Xerenge --output build/fable2-plume-overlay
          grep -q FABLE2_MISSING_PIPELINE build/fable2-plume-overlay/plume_draw.cpp
          grep -q FABLE2_DISABLE_GUEST_CULL build/fable2-plume-overlay/plume_draw.cpp
          grep -q FABLE2_DUMP_UCODE build/fable2-plume-overlay/plume_graphics_system.cpp
          grep -q FABLE2_PLUME_DRAW_CPP port/gpu/CMakeLists.txt
      - name: Resumo
        if: always()
        run: |
          echo 'Este workflow valida fontes e configuracao: NAO produz APK.' >> "$GITHUB_STEP_SUMMARY"
          echo 'A compilacao nativa e a compatibilidade GPU ainda nao foram validadas; somente fontes e utilitarios.' >> "$GITHUB_STEP_SUMMARY"
