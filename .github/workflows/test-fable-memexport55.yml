name: Fable II MemExport 55 - guest RAM transaction contract

on:
  push:
    paths:
      - 'port/gpu/fable_memexport_guest55.h'
      - 'scripts/apply_fable_plume55.py'
      - 'scripts/install_fable_plume55.py'
      - 'scripts/upgrade_fable55_ci.py'
      - 'scripts/install_fable_plume52.py'
      - 'scripts/install_fable_plume53.py'
      - 'scripts/build_fable_gpu.sh'
      - 'tests/test_memexport55.py'
      - 'tests/test_memexport55.cpp'
      - '.github/workflows/test-fable-memexport55.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guest-memory-transaction-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate overlay55 anchors, no Xerenge writes, backward-compatible CI
        run: python3 -m unittest discover -s tests -p test_memexport55.py -v
      - name: Test guest exclusion, mapping preflight, byte order and fence with Clang and GCC
        shell: bash
        run: |
          set -euo pipefail
          clang++ -std=c++20 -Wall -Wextra -Werror -pedantic \
            tests/test_memexport55.cpp -o "$RUNNER_TEMP/fable55-clang"
          "$RUNNER_TEMP/fable55-clang"
          g++ -std=c++20 -Wall -Wextra -Werror -pedantic \
            tests/test_memexport55.cpp -o "$RUNNER_TEMP/fable55-gcc"
          "$RUNNER_TEMP/fable55-gcc"
      - name: Validate installed script chain, fail closed without guest stop-world
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/build_fable_gpu.sh
          python3 scripts/install_fable_plume55.py --root . --check
          python3 scripts/upgrade_fable55_ci.py --root . --check
          python3 scripts/install_fable_plume53.py --root . --check
          python3 scripts/install_fable_plume52.py --root . --check
          grep -F 'apply_fable_plume55.py' scripts/build_fable_gpu.sh
          echo 'Public guest-write protocol tests only; actual SDK stop-world adapter and Android Vulkan runtime are NOT validated.' >> "$GITHUB_STEP_SUMMARY"
