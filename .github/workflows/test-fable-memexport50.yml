name: Fable II MemExport 50 - Vulkan readback contract
on:
  push:
    paths:
      - 'port/gpu/fable_memexport_vulkan50.h'
      - 'tests/test_fable_memexport_vulkan50.cpp'
      - '.github/workflows/test-fable-memexport50.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  memexport-handoff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Testar a ponte Vulkan/CPU sem jogo
        run: |
          set -euo pipefail
          clang++ -std=c++20 -Wall -Wextra -Werror -pedantic \
            tests/test_fable_memexport_vulkan50.cpp -o "$RUNNER_TEMP/fable50"
          "$RUNNER_TEMP/fable50"
          echo 'Only a Vulkan-to-CPU handoff contract, not GPU store emulation.' >> "$GITHUB_STEP_SUMMARY"
