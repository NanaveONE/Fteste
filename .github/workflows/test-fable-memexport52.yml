name: Fable II MemExport 52 - Vulkan bindings 8 e 9

on:
  push:
    paths:
      - 'scripts/apply_fable_plume52.py'
      - 'scripts/install_fable_plume52.py'
      - 'scripts/build_fable_gpu.sh'
      - 'port/gpu/fable_memexport52.h'
      - 'tests/test_memexport52.py'
      - 'tests/test_fable_memexport52.cpp'
      - '.github/workflows/test-fable-memexport52.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  binding-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Testar patch fail-closed e instalador idempotente
        run: python3 -m unittest discover -s tests -p test_memexport52.py -v
      - name: Compilar contrato com Clang e GCC
        shell: bash
        run: |
          set -euo pipefail
          clang++ -std=c++20 -Wall -Wextra -Werror -pedantic \
            tests/test_fable_memexport52.cpp -o "$RUNNER_TEMP/fable52-clang"
          "$RUNNER_TEMP/fable52-clang"
          g++ -std=c++20 -Wall -Wextra -Werror -pedantic \
            tests/test_fable_memexport52.cpp -o "$RUNNER_TEMP/fable52-gcc"
          "$RUNNER_TEMP/fable52-gcc"
      - name: Verificar integração já instalada sem reescrever build script
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/install_fable_plume52.py --root . --check
          bash -n scripts/build_fable_gpu.sh
          grep -F -- 'apply_fable_plume52.py' scripts/build_fable_gpu.sh
          echo 'GPU storage layouts tested; physical Android Vulkan runtime NOT tested.' >> "$GITHUB_STEP_SUMMARY"
