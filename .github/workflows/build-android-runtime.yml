name: Compilar ReXGlue Android ARM64 (sem dados do jogo)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Preparar Android SDK sem pacote legado tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Instalar ferramentas e Android NDK
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build cmake
          sdkmanager --install 'ndk;27.2.12479018' 'platforms;android-35'
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Baixar fork ReXGlue Android e submodulos
        run: |
          mkdir -p build/deps
          # Same ReXGlue revision as build-fable2-arm64-26.yml (# FTESTE_REXRUNTIME_16K_39)
          git clone https://github.com/shipa-2/rexglue-xerenge.git build/deps/rexglue-xerenge
          git -C build/deps/rexglue-xerenge checkout 3452b5ae307b5f71468cc8b9f18e7d7e0d4c245b
          git -C build/deps/rexglue-xerenge submodule update --init --recursive
      - name: Compilar, verificar ELF e coletar as dependencias ARM64
        env:
          BUILD_JOBS: '2'
        run: |
          bash scripts/build_rexglue_android_sdk.sh
          test -s build/artifacts/rexglue-android-arm64/librexruntime.so
          test -s build/artifacts/rexglue-android-arm64/runtime-build-report.json
          python3 - <<'PYREPORT'
          import json
          from pathlib import Path
          report = json.loads(Path('build/artifacts/rexglue-android-arm64/runtime-build-report.json').read_text())
          assert report['status'] == 'ARM64_ELF_AND_DT_NEEDED_VERIFIED', report
          print('Validated real ReXGlue Android arm64 ELF:', report['library_count'], 'shared libraries')
          PYREPORT
      - name: Publicar runtime ReXGlue e dependencias ARM64 verificadas
        uses: actions/upload-artifact@v4
        with:
          name: rexglue-android-arm64-runtime-only
          path: build/artifacts/rexglue-android-arm64/
          if-no-files-found: error
          retention-days: 7
      - name: Resumo
        if: always()
        run: |
          echo 'Build tenta produzir e inspecionar a biblioteca ReXGlue ARM64 real + DT_NEEDED.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Nao inclui codigo nem arquivos do jogo. Nao valida EDRAM/Vulkan/gameplay.' >> "$GITHUB_STEP_SUMMARY"
