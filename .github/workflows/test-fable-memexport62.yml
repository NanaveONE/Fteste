name: Fable II MemExport62 - pinned SDK guest and memory helper instrumentation
on:
  push:
    paths:
      - 'port/sdk/fable_memexport_sdk62.h'
      - 'scripts/patch_rex_memexport62.py'
      - 'scripts/build_rexglue_android_sdk.sh'
      - 'tests/test_memexport62.cpp'
      - 'tests/test_memexport62.py'
      - '.github/workflows/test-fable-memexport62.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate native concurrent telemetry and exact SDK anchors
        run: |
          c++ -std=c++20 -Wall -Wextra -Werror -pthread tests/test_memexport62.cpp -o /tmp/fable-memexport62
          /tmp/fable-memexport62
          python3 -m unittest discover -s tests -p test_memexport62.py -v
          bash -n scripts/build_rexglue_android_sdk.sh
